name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install chromium --only-shell
        timeout-minutes: 5
      - run: node tests/protocol.mjs
      - run: node tests/mailbox.mjs
      - run: node tests/cloud-mailbox.mjs
        timeout-minutes: 3
      - run: npm run test:live
        timeout-minutes: 4
      - run: npm run build
        env:
          VITE_STATIC_MODE: 'true'
          VITE_RELAY_URL: https://cesc-https-relay.wittygrove17.chatgpt.site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
